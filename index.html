 acc+=rate*dt;while(acc>=1){acc--;const k=rnd(),f={x0:rnd()*LW,y:-6,vy:24+rnd()*28,amp:3+rnd()*7,fr:.6+rnd()*.8,ph:rnd()*6.28,pal:FP[(rnd()*4)|0],k:k<.55?'f':k<.9?'p':'h',age:0};F.push(f)}
 for(const f of F){f.y+=f.vy*dt;f.age+=dt}
 F=F.filter(f=>f.y<LH+8);
 if(t>=13){const n=Math.floor((t-13)/2.6);if(n!==lastHeart){lastHeart=n;spawnHeart(sx()+100,sy()+28)}}
 for(const h of HR)h.age+=dt;HR=HR.filter(h=>h.age<3);
 for(const r of RG)r.a+=dt;RG=RG.filter(r=>r.a<2.2);
 if(mode&&playing){const e=env();if(e>.6&&t-lastHt>.9){lastHt=t;spawnHeart(sx()+96+((rnd()*10)|0),sy()+30)}if(e>.35&&t-lastRing>.45){lastRing=t;RG.push({a:0})}}
 if(t>14&&!mode)btn.style.display='block';}
const sx=()=>Math.floor((LW-SW)/2),sy=()=>Math.floor(LH*.5-SHT/2);
function draw(){
 const d=Math.round(clamp((t-8.8)/2.5)*10)/10,bh=Math.ceil(LH/8);
 for(let i=0;i<8;i++){g.fillStyle=mode?mix(DW[i],NT[i],Math.round(clamp((t-m0)/1.8)*10)/10):d<.5?mix(NT[i],DU[i],d*2):mix(DU[i],DW[i],d*2-1);g.fillRect(0,i*bh,LW,bh)}
 if(d<.5||mode)for(const s of stars){g.fillStyle=(((t*2+s.p)|0)%3)?'#ffffff':'#8e96d0';g.fillRect(s.x,s.y,1,1)}
 if(mode){if(t-m0>.9){const mx=Math.floor(LW*.78),my=Math.floor(LH*.13);for(let y=-12;y<=12;y++)for(let x=-12;x<=12;x++)if(x*x+y*y<=144){g.fillStyle=(x+4)*(x+4)+(y-3)*(y-3)<9?'#e9d9a6':'#fff3cf';g.fillRect(mx+x,my+y,1,1)}}
  const cx=sx()+71,cy=sy()+71;
  for(const r of RG){const rad=Math.floor(74+r.a*38);g.fillStyle=r.a<.7?'#ffc2d1':r.a<1.4?'#e08fb0':'#8f5f95';for(let i=0,n=rad*5;i<n;i++){const a=i/n*6.283;g.fillRect(Math.round(cx+Math.cos(a)*rad),Math.round(cy+Math.sin(a)*rad),1,1)}}
  const N=24,x0=Math.floor((LW-N*7)/2),fr=aud&&aud.duration?aud.currentTime/aud.duration:0;
  for(let i=0;i<N;i++){const lit=i/N<fr;g.fillStyle=lit?'#ffe08a':'#4a4f8a';g.fillRect(x0+i*7,LH-60,lit?3:1,lit?3:1)}}
 for(const r of R){const p=clamp((t-r.t0)/r.dur),y=Math.floor(LH+(r.ty-LH)*ease(p));g.fillStyle='#ffffff';g.fillRect(r.x,y,1,2);
  for(let k=1;k<5;k++){g.fillStyle=k<3?'#ffd27a':'#8f6420';g.fillRect(r.x,y+1+k*2,1,1)}}
 for(const p of P){const a=p.age/p.life,i=a<.45?0:a<.8?1:2;g.fillStyle=p.sh[i];const s=a<.15?2:1;g.fillRect(Math.floor(p.x),Math.floor(p.y),s,s)}
 for(const f of F){const x=Math.floor(f.x0+Math.sin(f.ph+f.age*f.fr*6.283)*f.amp);
  if(f.k==='f')spr(FL,f.pal,x,f.y);else if(f.k==='p')spr((((f.age*2+f.ph)|0)%2)?PT:PT2,{P:f.pal.P},x,f.y);else spr(HT,{R:HS[0]},x,f.y)}
 if(SD&&t>=11){const p=ease(clamp((t-11)/2)),bob=t>13?(((t*.7)|0)&1):0;
  if(p>=1)g.drawImage(OC,sx(),sy()+bob);
  else{const d2=DC.getContext('2d'),id=d2.createImageData(SW,SHT),s=SD.data,o=id.data;
   for(let i=0;i<ORD.length;i++)if(ORD[i]<p){const j=i*4;o[j]=s[j];o[j+1]=s[j+1];o[j+2]=s[j+2];o[j+3]=s[j+3]}
   d2.putImageData(id,0,0);g.drawImage(DC,sx(),sy())}}
 for(const h of HR){const a=h.age/3,x=h.x0+Math.sin(h.ph+h.age*2)*3,y=h.y-h.age*9;spr(HT,{R:HS[a<.5?0:a<.8?1:2]},x,y)}
 if(eggOn()){const ex=Math.floor(LW/2-11),ey=sy()+SHT+10+((((t*1.5)|0)&1)&&!playing?1:0);
  spr(EV,EP,ex,ey,2);
  if(playing&&aud.duration){const w=Math.floor(40*aud.currentTime/aud.duration);g.fillStyle='#8a5a6a';g.fillRect(ex-9,ey+20,42,3);g.fillStyle='#fff6f8';g.fillRect(ex-8,ey+21,40,1);g.fillStyle='#ff7fa1';g.fillRect(ex-8,ey+21,w,1)}
  const rc=c.getBoundingClientRect();hint.style.top=(rc.top+(ey+19)*S/dpr)+'px';hint.style.display=playing?'none':'block'}
 else hint.style.display='none';
 mc.imageSmoothingEnabled=false;mc.drawImage(L,0,0,LW,LH,0,0,LW*S,LH*S);}
let last=0;
function frame(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;step(dt);draw();requestAnimationFrame(frame)}
function start(){size();reset();
 if(FREEZE!=null){for(let i=0;i<FREEZE*60;i++)step(1/60);draw();return}
 requestAnimationFrame(n=>{last=n;frame(n)})}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),lx=(e.clientX-r.left)*dpr/S|0,ly=(e.clientY-r.top)*dpr/S|0;
 if(hitEgg(e))return;
 if(t<13)launch(lx,Math.max(8,ly),SHK[(rnd()*5)|0],false);else for(let i=0;i<3;i++)spawnHeart(sx()+96+i*6,sy()+30+i*4)});
btn.addEventListener('pointerdown',e=>{e.stopPropagation();reset()});
c.addEventListener('click',e=>{if(hitEgg(e))enter()});
btnP.addEventListener('click',()=>{if(!aud)return;if(playing){aud.pause();playing=false;btnP.textContent='▶ 继续'}else tryPlay()});
btnA.addEventListener('click',()=>{aud.currentTime=0;tryPlay();btnA.style.display='none';btn.style.display='none';btnP.style.display='block'});
addEventListener('resize',()=>{size()});
img.onload=()=>{SW=img.width;SHT=img.height;OC.width=DC.width=SW;OC.height=DC.height=SHT;
 const o=OC.getContext('2d');o.drawImage(img,0,0);SD=o.getImageData(0,0,SW,SHT);
 const r2=mulberry32(7);ORD=new Float32Array(SW*SHT);for(let i=0;i<ORD.length;i++)ORD[i]=r2();start()};
img.src=SPR;
})();
</script></body></html>
